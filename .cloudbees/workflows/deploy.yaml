apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: component-deploy

# Simulated component deployment.
# - Called by the application's deployer (workflow_call), or run standalone (workflow_dispatch).
# - Mock/echo only: it SIMULATES a deploy and publishes evidence. It does not
#   deploy to a real cluster.
# - Job-level environment + "kind: deploy" step so DORA metrics populate.
# - DEMO MODE: no random failures - every deployment succeeds.
#   (Random version kept separately as deploy-random.yaml.)
# - Evidence is published on success AND on failure (failure step only fires on a real error).

on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
      environment:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      artifact-id:
        type: string
        default: orders-api:1.4.0
      environment:
        type: choice
        options:
          - staging
          - prod
        default: staging

jobs:
  deploy:
    # DORA metrics need the target environment declared at job level.
    # The environment must already exist in Unify (staging / prod).
    environment: ${{ inputs.environment }}
    steps:
      - name: Simulate deployment
        # Marks this step as a deployment for DORA / deployment analytics
        kind: deploy
        uses: docker://alpine:3.20
        shell: sh
        run: |
          ENV="${{ inputs.environment }}"

          echo "== Simulated component deployment =="
          echo "Component:    orders-api"
          echo "Artifact:     ${{ inputs.artifact-id }}"
          echo "Environment:  $ENV"
          if [ "$ENV" = "prod" ]; then
            echo "Production policy: approval and change ticket required (talking point)"
          else
            echo "Non-production policy: standard checks passed"
          fi
          echo "Deploy status: SUCCESS (simulated)"
      - name: Publish evidence
        if: ${{ success() }}
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Component deployment (simulated)
            - Component: orders-api
            - Artifact: ${{ inputs.artifact-id }}
            - Environment: ${{ inputs.environment }}
            - Status: **success** (simulated)
      # NEW: failed deployments leave an audit trail too.
      # The job stays FAILED (so DORA still counts it); this step only records why.
      - name: Publish failure evidence
        if: ${{ failure() }}
        uses: https://github.com/cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Component deployment FAILED (simulated)
            - Component: orders-api
            - Artifact: ${{ inputs.artifact-id }}
            - Environment: ${{ inputs.environment }}
            - Status: **failed**
            - Release halted: no promotion beyond this environment
 
