name: External CI - Build Test Scan
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions: 
  id-token: write
  contents: read
jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          echo "Build orders-api"
          mkdir -p build
          echo "demo artifact" > build/orders-api.txt
      - name: Unit tests
        run: |
          echo "PASS: unit tests"
      - name: Security scan placeholder
        run: |
          echo "Critical: 0"
          echo "High: 0"
      - name: Publish release evidence
        run: |
          cat > release-evidence.json <<JSON
          {
            "application": "customer-portal",
            "component": "orders-api",
            "build": "${{ github.run_number }}",
            "commit": "${{ github.sha }}",
            "tests": "passed",
            "security": "passed"
          }
          JSON
          cat release-evidence.json
      - name: Publish evidence to CloudBees Unify
        uses: cloudbees-io-gha/publish-evidence-item@v2
        with:
          content: |-
            ## Change evidence: orders-api build ${{ github.run_number }}
 
            **Source toolchain:** GitHub Actions (external CI, no migration)
 
            - **Application:** customer-portal
            - **Component:** orders-api
            - **Build number:** ${{ github.run_number }}
            - **Commit:** [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - **Branch:** ${{ github.ref_name }}
            - **Triggered by:** ${{ github.actor }} (${{ github.event_name }})
            - **Pipeline run:** [View in GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
 
            ### Controls
            - **Unit tests:** PASSED
            - **Security scan:** PASSED (Critical: 0, High: 0)
            - **Build artifact:** build/orders-api.txt
